[project]
name = "tiny-event-relay"
version = "0.1.0"
description = "A bounded, durable local HTTP event relay"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tiny-event-relay = "relay.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["relay*"]
