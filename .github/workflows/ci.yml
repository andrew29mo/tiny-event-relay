name: Relay correctness
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Check macOS receiver startup without reverse DNS
        if: runner.os == 'macOS'
        run: |
          python -u - <<'PY_STARTUP'
          import subprocess, sys
          # Fail quickly on listener startup regressions before running all process tests.
          code = """
          import tempfile
          from pathlib import Path
          from unittest.mock import patch
          from tools.receiver import Receiver
          with tempfile.TemporaryDirectory() as directory:
              with patch('socket.getfqdn', side_effect=AssertionError('startup must not need reverse DNS')):
                  receiver = Receiver(str(Path(directory)/'sink.sqlite'), port=0)
              try:
                  print('Production receiver bound without reverse DNS', receiver.server.server_address)
              finally:
                  receiver.server.server_close()
                  receiver.db.close()
          """
          subprocess.run([sys.executable, '-u', '-c', code], check=True, timeout=12)
          PY_STARTUP
      - run: python -m tools.test_suite --output results/local/ci-tests
      - run: python -m tools.check_report results/native-macos/benchmark
      - run: python -m tools.check_validation results/native-macos
      - run: python -m tools.check_local reviews/local-validation-startup
